<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * {}

        body {
            margin: 0;
            padding: 0;
        }

        .wrapper {}

        .wrapper>header {}

        .wrapper>main {}

        .wrapper>main>section {}

        .wrapper>main>section.banner>.swiper {
            min-height: 720px;
            position: relative;
        }

        .wrapper>main>section>.banner>.swiper-wrapper {
            height: 100%
        }

        .wrapper>main>section>.banner>.swiper-wrapper>.swiper-slide {
            height: 100%
        }

        .swiper-pagination-bullet {
            width: 5px;
            height: 5px;
        }

        .swiper-pagination-bullet-active {
            background-color: white;
        }

        .swiper-pagination {
            color: white;
            font-size: 1.2rem;
            position: absolute;
            left: 15.625vw;
            top: 80%;
            width: 300px;
            letter-spacing: 3px;
        }

        .swiper-pagination-current {
            color: royalblue;
        }

        .swiper-pagination-total {}

        .swiper-button-next,
        .swiper-button-prev {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            top: 82%;
        }

        .swiper-button-next {
            left: calc(15.625vw + 180px);
        }

        .swiper-button-prev {
            left: calc(15.625vw + 65px)
        }

        .swiper-button-next::after,
        .swiper-button-prev::after {
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
        }

        .start-stop-toggle {
            position:absolute;
            top:79%;
            z-index:100;
            left:calc(15.625vw + 10px);
            color:white;
            cursor: pointer;
        }

        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 48;
            font-size:3rem;
            border:3px solid;
            border-radius: 50%;
        }

        .wrapper>main>section>.banner>.swiper-wrapper>.swiper-slide>a .wrapper>main>section>.banner>.swiper-wrapper>.swiper-slide>a>img {

        }
    </style>
</head>

<body>

    <div class="wrapper">
        <header></header>
        <main>
            <section class="banner">
                <!-- Slider main container -->
                <div class="swiper">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/01_it_banner(0).jpg" alt="">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/02.jpg" alt="">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/03.jpg" alt="">
                            </a>

                        </div>
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/04.jpg" alt="">
                            </a>
                        </div>
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>


                    <!-- stop/start버튼 -->
                     <div class="start-stop-toggle">
                        <span class="material-symbols-outlined">
                            <!-- pause -->
                             play_arrow
                        </span>
                     </div>

                    <!-- If we need scrollbar -->
                    <!-- <div class="swiper-scrollbar"></div> -->
                </div>

            </section>
        </main>
        <footer></footer>
    </div>

    <script>

        const swiperBanner = new Swiper('.swiper', {
            // const swiperBanner = new Swiper('선택자', {옵션들})
            // Optional parameters
            direction: 'horizontal', //horizontal(수평 slide),vertical(수직 slide)
            autoplay: {
                delay: 2000,
                // pauseOnMouseEnter: true,
            },
            loop: true,
            effect: "slide", //slide(기본),fade,scroll,cube,coverflow,flip
            mousewheel: true,

            // If we need pagination (몇 페이지)
            pagination: {
                el: '.wrapper>main>section.banner>.swiper .swiper-pagination',
                clickable: true,
                type: 'fraction', //bullets(기본),fraction,progressbar
            },

            // Navigation arrows
            navigation: {
                nextEl: '.wrapper>main>section.banner>.swiper .swiper-button-next',
                prevEl: '.wrapper>main>section.banner>.swiper .swiper-button-prev',
            },

            // // And if we need scrollbar
            // scrollbar: {
            //     el: '.swiper-scrollbar',
            // },
        })
        //토글버튼 만들기
            const playPauseBtn = document.querySelector('.start-stop-toggle span');
            let isPlaying = true;
            playPauseBtn.addEventListener('click',()=>{
                if(isPlaying){
                    playPauseBtn.innerHTML='pause';
                    swiperBanner.autoplay.stop();
                    isPlaying=false;
                }else{
                     playPauseBtn.innerHTML='play_arrow';
                     swiperBanner.autoplay.strat();
                    isPlaying=true;
                }
            });


    </script>

</body>

</html>
